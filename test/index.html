<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#15202b">
<title>Проверка знаний</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#eefaff;--bg2:#c8ecf7;--accent:#0e7490;--accent2:#22b8cf;
  --ink:#15202b;--card:#ffffff;--muted:#5d6a7a;--line:#cfe8f2;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font:16px/1.55 Manrope,Arial,"Segoe UI",sans-serif;color:var(--ink);
  background:
    radial-gradient(1100px 620px at 12% -10%, color-mix(in srgb,var(--accent2) 26%, transparent), transparent 60%),
    radial-gradient(900px 620px at 110% 10%, color-mix(in srgb,var(--accent) 18%, transparent), transparent 62%),
    linear-gradient(150deg,var(--bg1),var(--bg2));
  background-attachment:fixed;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(2px);pointer-events:none;z-index:0;opacity:.5}
body::before{width:42vmax;height:42vmax;left:-18vmax;top:-16vmax;background:radial-gradient(circle at 35% 35%,color-mix(in srgb,var(--accent2) 45%,transparent),transparent 64%)}
body::after{width:38vmax;height:38vmax;right:-16vmax;bottom:-18vmax;background:radial-gradient(circle at 65% 35%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 68%)}
.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:20px 16px 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 16px;color:var(--ink)}
.brand{font:800 15px/1 Unbounded,Manrope,sans-serif;letter-spacing:.02em;opacity:.95}
.top a{color:color-mix(in srgb,var(--accent) 75%,#000);text-decoration:none;font-size:13.5px;font-weight:700;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.card{position:relative;background:color-mix(in srgb,var(--card) 94%, transparent);border:1px solid rgba(255,255,255,.55);
  border-radius:26px;padding:24px;margin:0 0 16px;box-shadow:0 18px 50px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.8);
  backdrop-filter:blur(10px);animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.hero{padding:28px;overflow:hidden}
.hero::before{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,var(--accent),transparent 68%);opacity:.55}
.hero::after{content:"";position:absolute;left:-40px;bottom:-90px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle at 60% 40%,var(--accent2),transparent 70%);opacity:.35}
.icon{position:relative;z-index:1;width:58px;height:58px;display:grid;place-items:center;border-radius:18px;font-size:30px;
  background:linear-gradient(145deg,var(--accent),var(--accent2));box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 45%,transparent);margin-bottom:12px}
h1{position:relative;z-index:1;font:700 30px/1.14 Unbounded,Manrope,Georgia,serif;margin:0 0 8px;letter-spacing:-.01em}
.meta{position:relative;z-index:1;color:var(--muted);font-size:14px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800;
  background:color-mix(in srgb,var(--accent) 18%,#fff);color:color-mix(in srgb,var(--accent) 70%,#000)}
label{display:block;font-weight:800;font-size:13px;margin:16px 0 6px;color:#33404f}
input{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font:800 16px Manrope,Arial;color:#fff;cursor:pointer;margin-top:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 12px 26px color-mix(in srgb,var(--accent) 28%,transparent);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:active{transform:none}.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.accent{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.q{position:relative;border:1px solid var(--line);border-radius:20px;padding:18px;margin:0 0 14px;background:#fff;overflow:hidden;animation:qIn .35s ease both}
@keyframes qIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.q b{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;font-size:16.5px;line-height:1.4}
.qn{flex:0 0 auto;display:grid;place-items:center;width:30px;height:30px;border-radius:10px;font:800 14px Unbounded,Manrope;
  background:linear-gradient(145deg,var(--accent),var(--accent2));color:#241a06}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 13px;border:2px solid var(--line);border-radius:14px;margin:8px 0;cursor:pointer;transition:all .16s;background:#fff}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 55%,#fff);transform:translateX(2px)}
.opt input{margin-top:4px;width:auto;accent-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,#fff),#fff);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 14%,transparent)}
.prog{display:flex;align-items:center;gap:12px;margin:0 0 14px;color:var(--ink);font-size:13px;font-weight:800}
.prog .bar{flex:1;height:9px;border-radius:999px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
.score{font:800 54px/1 Unbounded,Manrope,serif;color:var(--ink);letter-spacing:-.02em;margin-bottom:6px}
.res-emoji{font-size:52px;line-height:1;margin-bottom:8px;display:block;animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.small{font-size:13.5px;color:var(--muted)}
.err{color:#a02020;font-weight:700}
.hidden{display:none}
a{color:color-mix(in srgb,var(--accent) 75%,#000)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.review{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
.review .r{padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.review .r:last-child{border:0}.review .ok{color:#0f766e;font-weight:800}.review .no{color:#b42318;font-weight:800}
@media (max-width:520px){h1{font-size:24px}.card{padding:18px;border-radius:20px}.hero{padding:20px}.score{font-size:44px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="brand">Проверка знаний</span></div>
  <div class="card hero" id="load"><div class="icon">🧪</div><h1>Загружаю тест…</h1><p class="meta" id="loadMsg">Это займёт пару секунд.</p></div>
  <div id="app" class="hidden"></div>
</div>
<script>
"use strict";
const CLOUD = { url: "https://omnqygnlibkcybwryrrh.supabase.co", anonKey: "sb_publishable__TQ0PihqCpQldAKJhdzSRA_UVjUoqFj" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const qid = new URLSearchParams(location.search).get("q") || "";
const S = { q: null, picked: {}, student: "", klass: "" };

/* 8 палитр; выбор зависит от предмета и темы */
const THEMES = {
  coastal:  { bg1:"#eefaff", bg2:"#c8ecf7", accent:"#0e7490", accent2:"#22b8cf", line:"#cfe8f2", icon:"🌊" },
  whimsy:   { bg1:"#fff2f8", bg2:"#ffe0ef", accent:"#db2777", accent2:"#f472b6", line:"#f7d4e5", icon:"✨" },
  botanical:{ bg1:"#f2fcf5", bg2:"#d6f2df", accent:"#15803d", accent2:"#4ade80", line:"#d8ecdf", icon:"🌿" },
  sunset:   { bg1:"#fff5ea", bg2:"#ffe2c4", accent:"#ea580c", accent2:"#fb923c", line:"#f4dfca", icon:"🌅" },
  space:    { bg1:"#f4f2ff", bg2:"#e0d9ff", accent:"#6d28d9", accent2:"#a78bfa", line:"#e2d9f5", icon:"🌌" },
  paper:    { bg1:"#fdf9ee", bg2:"#f5e9d2", accent:"#a16207", accent2:"#d9a441", line:"#e9dec8", icon:"📜" },
  mint:     { bg1:"#effcf9", bg2:"#ccfbf1", accent:"#0f766e", accent2:"#2dd4bf", line:"#d2ede7", icon:"🧬" },
  berry:    { bg1:"#fff1f2", bg2:"#ffe0e6", accent:"#be123c", accent2:"#fb7185", line:"#f5d6dc", icon:"📚" }
};
const SUBJ_THEME = { geo:"coastal", bio:"botanical", chem:"mint", math:"space", phys:"space", inf:"space", hist:"sunset", soc:"berry", lit:"paper", ru:"berry", eng:"coastal", mhk:"whimsy", izo:"whimsy", mus:"whimsy" };
function themeFor(d) {
  const subj = String(d.subject || "").toLowerCase().slice(0, 4);
  const m = Object.keys(SUBJ_THEME).find(k => subj.startsWith(k));
  let key = m ? SUBJ_THEME[m] : "coastal";
  const str = String(d.title || d.subject || "учу");
  if (!m) { const keys = Object.keys(THEMES); let h = 0; for (const ch of str) h = (h * 31 + ch.charCodeAt(0)) >>> 0; key = keys[h % keys.length]; }
  return { ...THEMES[key], key };
}
function applyTheme(t) {
  const r = document.documentElement.style;
  r.setProperty("--bg1", t.bg1); r.setProperty("--bg2", t.bg2); r.setProperty("--accent", t.accent);
  r.setProperty("--accent2", t.accent2); r.setProperty("--line", t.line);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", t.bg1);
}
async function api(path, opt = {}) {
  const r = await fetch(CLOUD.url.replace(/\/+$/, "") + path, { ...opt, headers: { apikey: CLOUD.anonKey, "Content-Type": "application/json", ...(opt.headers || {}) } });
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch { }
  if (!r.ok) throw new Error(j?.message || j?.error || ("HTTP " + r.status));
  return j;
}
async function boot() {
  if (!qid || !/^[a-z0-9]{6,32}$/.test(qid)) { fail("Ссылка на тест неверна."); return; }
  try {
    const j = await api("/rest/v1/rpc/quiz_public", { method: "POST", body: JSON.stringify({ p_id: qid }) });
    if (!j || !Array.isArray(j.questions) || !j.questions.length) throw new Error("Тест не найден или вопросы ещё не сохранены.");
    S.q = j; S.theme = themeFor(j); applyTheme(S.theme);
    $("load").classList.add("hidden"); $("app").classList.remove("hidden"); intro();
  } catch (e) { fail("Не удалось открыть тест: " + (e.message || e)); }
}
function fail(t) {
  $("load").classList.remove("hidden");
  $("load").innerHTML = '<div class="icon">😕</div><h1>Тест недоступен</h1><p class="err"></p>';
  $("load").querySelector(".err").textContent = t;
}
function intro() {
  const d = S.q, t = S.theme;
  $("app").innerHTML = `<div class="card hero"><div class="icon">${t.icon}</div><h1>${esc(d.title || "Проверка знаний")}</h1>
    <div class="meta">${esc(d.subject || "")}${d.grade ? " · " + esc(d.grade) + " класс" : ""}</div>
    <div class="chip">${d.questions.length} вопросов · проверка знаний</div>
    <label for="name">Фамилия и имя</label><input id="name" autocomplete="name" placeholder="Иванов Иван">
    <label for="klass">Класс</label><input id="klass" autocomplete="off" placeholder="${esc(d.grade || "")}">
    <button class="btn accent" id="start">Начать тест →</button><p class="err" id="err"></p>
    <p class="small" style="margin-top:12px">Результат увидит учитель в личном кабинете.</p></div>`;
  $("start").onclick = () => {
    const name = $("name").value.trim();
    if (name.length < 3) { $("err").textContent = "Впишите фамилию и имя."; return; }
    S.student = name; S.klass = $("klass").value.trim(); quiz();
  };
}
function quiz() {
  const Q = S.q.questions, t = S.theme;
  $("app").innerHTML = `<div class="prog"><span id="pc">0 / ${Q.length}</span><div class="bar"><i id="pb"></i></div></div>
    <div class="card hero"><div class="icon">${t.icon}</div><h1>${esc(S.q.title || "Тест")}</h1><div class="meta">${esc(S.student)}${S.klass ? " · " + esc(S.klass) : ""}</div></div>
    <div id="qs"></div>
    <div class="card"><button class="btn accent" id="finish">Проверить результат</button><p class="small" id="progNote">Выберите ответ в каждом вопросе.</p></div>`;
  $("qs").innerHTML = Q.map((x, i) => `<div class="q" data-i="${i}"><b><span class="qn">${i + 1}</span><span>${esc(x.q)}</span></b>${x.options.map((o, k) => `<label class="opt"><input type="radio" name="q${i}" value="${k}"><span>${esc(o)}</span></label>`).join("")}</div>`).join("");
  const update = () => {
    const n = Object.keys(S.picked).length;
    $("pc").textContent = n + " / " + Q.length; $("pb").style.width = (n / Q.length * 100) + "%";
    $("progNote").textContent = n < Q.length ? "Отвечено " + n + " из " + Q.length : "Можно проверять результат.";
  };
  $("qs").addEventListener("change", e => {
    const q = e.target.closest(".q"); if (!q) return;
    S.picked[+q.dataset.i] = +e.target.value;
    q.querySelectorAll(".opt").forEach(o => o.classList.toggle("sel", o.contains(e.target)));
    update();
  });
  update();
  $("finish").onclick = finish;
}
async function finish() {
  const Q = S.q.questions, t = S.theme;
  if (Object.keys(S.picked).length < Q.length) { alert("Ответьте на все вопросы."); return; }
  const rows = Q.map((x, i) => ({ q: x.q, answer: x.options[x.answer], picked: x.options[S.picked[i]], ok: S.picked[i] === x.answer, explain: x.explain || "" }));
  const score = rows.filter(r => r.ok).length, pct = Math.round(score / rows.length * 100);
  const emoji = pct === 100 ? "🏆" : pct >= 80 ? "🌟" : pct >= 50 ? "💪" : "📚";
  const title = pct === 100 ? "Блестяще!" : pct >= 80 ? "Отличный результат!" : pct >= 50 ? "Неплохо, есть что повторить" : "Нужно повторить тему";
  const details = { answers: rows, wrong: rows.map((r, i) => r.ok ? null : i + 1).filter(Boolean), own: "", sections: { "Тест": score + " / " + rows.length } };
  $("app").innerHTML = `<div class="card hero"><span class="res-emoji">${emoji}</span><div class="score">${score} / ${rows.length}</div><h1>${title}</h1>
    <div class="meta">${esc(S.student)}${S.klass ? " · " + esc(S.klass) : ""}</div>
    <div class="chip">${pct}% верных ответов</div>
    <div class="review">${rows.map((r, i) => `<div class="r"><b>${i + 1}. ${esc(r.q)}</b><br><span class="${r.ok ? "ok" : "no"}">${r.ok ? "Верно" : "Ошибка"}</span> · правильный ответ: <b>${esc(r.answer)}</b>${r.explain && !r.ok ? "<br><span class='small'>" + esc(r.explain) + "</span>" : ""}</div>`).join("")}</div>
    <p class="small" id="send">Отправляю результат учителю…</p>
</div>`;
  try {
    await api("/rest/v1/quiz_results", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify({ quiz_id: qid, student: S.student, klass: S.klass, score, total: rows.length, details }) });
    $("send").textContent = "Результат отправлен учителю. Спасибо!";
  } catch (e) { $("send").textContent = "Результат не отправлен: " + (e.message || e); $("send").classList.add("err"); }
}
boot();
</script>
</body>
</html>
