<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Все уроки ФРП</title>
<style>
body{margin:0;background:#efe9dc;color:#1f2a37;font:16px/1.5 system-ui,Arial,sans-serif}
header{padding:20px clamp(16px,4vw,48px);background:#141414;color:#fff}
header h1{margin:0 0 4px;font:700 clamp(24px,3vw,34px)/1.05 Georgia,serif}
header a{color:#f2c14e;text-decoration:none;font-size:13px}
.wrap{max-width:1200px;margin:0 auto;padding:22px clamp(12px,3vw,36px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{display:block;text-decoration:none;color:inherit;background:#fffdf8;border:1px solid #d8cfc0;border-radius:14px;padding:14px;box-shadow:0 8px 20px rgba(40,30,10,.08)}
.card b{display:block;font-size:16px;margin-bottom:4px}
.card span{font-size:12.5px;color:#5d6875}
.note{color:#5d6875;font-size:13px;margin:12px 0}
</style>
</head>
<body>
<header><h1>Все уроки ФРП</h1><a href="../index.html">← База знаний</a></header>
<div class="wrap"><p class="note">Для каждого урока создана отдельная папка и страница с двухколоночным макетом. В уроке может быть несколько изображений — листайте стрелками.</p><div id="grid" class="grid">Загрузка…</div></div>
<script>
fetch("manifest.json",{cache:"no-store"}).then(r=>r.json()).then(m=>{
 const g=document.getElementById("grid"); g.innerHTML=(m.subjects||[]).map(s=>{
  const first=s.grades?.[0]; const href=first?`${s.key}/${first.grade}/001/`:"#";
  return `<a class="card" href="${href}"><b>${s.title}</b><span>${s.count} уроков · ${s.grades.map(x=>x.grade+" кл.").join(", ")}</span></a>`;
 }).join("");
}).catch(e=>document.getElementById("grid").textContent="Не удалось загрузить manifest: "+e.message);
</script>
</body>
</html>
