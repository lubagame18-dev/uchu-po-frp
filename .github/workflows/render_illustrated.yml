name: Render illustrated Russian lesson slides
on:
  push:
    branches: [main]
    paths:
      - 'presentation_database/render_illustrated.py'
      - 'presentation_database/verified_examples.json'
      - 'frp_tasks/ru.json'
      - '.github/workflows/render_illustrated.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python presentation_database/render_illustrated.py
      - name: Publish SVG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentation_database/illustrated/ presentation_database/russian_all_lessons_1-11_svg.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish illustrated Russian SVG slides for grades 1-11"
            git push
          fi
