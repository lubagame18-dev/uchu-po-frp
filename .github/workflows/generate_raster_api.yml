name: Generate real Russian lesson illustrations using paid API
on:
  schedule:
    - cron: '49 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: illustrated-russian-raster
  cancel-in-progress: false
jobs:
  generate:
    if: ${{ vars.ENABLE_PAID_IMAGE_GENERATION == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      ENABLE_PAID_IMAGE_GENERATION: 'true'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      IMAGE_BATCH_SIZE: ${{ vars.IMAGE_BATCH_SIZE || '12' }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'openai>=2.0.0' 'Pillow>=11.0.0'
      - run: python presentation_database/generate_raster_api.py
      - name: Upload real images to repository
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentation_database/illustrated_raster/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish real illustrated lesson posters'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
