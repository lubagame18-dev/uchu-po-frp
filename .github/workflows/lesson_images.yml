name: База иллюстраций к урокам (Википедия и Викисклад)

# Собирает по одной-две свободные иллюстрации к каждому уроку по правилам tools/lessonimg/*.txt
on:
  push:
    branches: [main, codex/pocketbase-accounts]
    paths: ["tools/lessonimg/*.txt", "tools/lessonimg/fetch.py"]
  workflow_dispatch:
    inputs:
      subjects:
        description: "Предметы через пробел (пусто — все)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: lesson-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: Сбор иллюстраций
        run: python3 tools/lessonimg/fetch.py ${{ github.event.inputs.subjects }}
      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add img/lessons data/lesson-images.js tools/lessonimg/report.txt
          git diff --cached --quiet && { echo "без изменений"; exit 0; }
          git commit -m "База иллюстраций к урокам (Википедия, Викисклад, свободные лицензии)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
