name: Выкладка сайта в Яндекс Облако

# Ручной деплой; автоматическая выгрузка на каждый push остаётся отключённой.
on:
  workflow_dispatch:
    inputs:
      assets_ref:
        description: 'Коммит файлов для выкладки (пусто — текущая ветка)'
        type: string
        default: ''
      accounts_only:
        description: 'Выгрузить только файлы кабинета'
        type: boolean
        default: false
      check_only:
        description: 'Только проверить доступ к бакету, без загрузки'
        type: boolean
        default: false

concurrency:
  group: deploy-yandex
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET }}
      AWS_DEFAULT_REGION: ru-central1
      BUCKET: uchu-po-frp.ru
      ENDPOINT: https://storage.yandexcloud.net
      ACCOUNT_FILES: vendor/jszip.min.js vendor/docx.umd.js data/legal.js js/privacy.js js/access.js js/quizlink.js legal/legal.css legal/privacy.html legal/consent.html legal/data-rights.html legal/oferta.html legal/contacts.html legal/tarify.html legal/archive/2026-11-13/privacy.html legal/archive/2026-11-13/consent.html legal/archive/2026-11-13/oferta.html vendor/fonts/fonts.css vendor/fonts/*.woff2 vendor/fonts/*LICENSE.txt js/accounts-backend.js js/account.js js/cloudbase.js js/rules.js js/yandex-auth.js accounts-confirm.html google.html yandex.html test/index.html taras-bulba/index.html taras-bulba/results.html sw.js js/accounts-config.js index.html
    steps:
      - name: Проверка ключей
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" || { echo '::error::Не заданы ключи деплоя'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.assets_ref || github.ref }}
      - name: Проверка доступа к бакету
        run: aws s3api head-bucket --bucket "$BUCKET" --endpoint-url "$ENDPOINT"
      - name: Сохранить текущие файлы кабинета
        if: ${{ !inputs.check_only && inputs.accounts_only }}
        run: |
          mkdir -p "$RUNNER_TEMP/account-before"
          for f in $ACCOUNT_FILES; do
            mkdir -p "$RUNNER_TEMP/account-before/$(dirname "$f")"
            if ! aws s3 cp "s3://$BUCKET/$f" "$RUNNER_TEMP/account-before/$f" --endpoint-url "$ENDPOINT" --no-progress 2>"$RUNNER_TEMP/backup-error"; then
              if grep -Eq 'NoSuchKey|\(404\)|Not Found' "$RUNNER_TEMP/backup-error"; then
                rm -f "$RUNNER_TEMP/account-before/$f"
                echo "$f" >> "$RUNNER_TEMP/account-before/missing.txt"
              else
                echo "::error::Не удалось сохранить $f перед выкладкой"; exit 1
              fi
            fi
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.check_only && inputs.accounts_only }}
        with:
          name: account-before-${{ github.run_id }}
          path: ${{ runner.temp }}/account-before
          retention-days: 30
      - name: Файлы кабинета
        id: account_upload
        if: ${{ !inputs.check_only && inputs.accounts_only }}
        run: |
          for f in $ACCOUNT_FILES; do
            [ -f "$f" ] || continue
            aws s3 cp "$f" "s3://$BUCKET/$f" --endpoint-url "$ENDPOINT" --cache-control "no-cache" --no-progress
          done
      - name: Вернуть файлы после неудачной выкладки
        if: ${{ failure() && steps.account_upload.outcome == 'failure' }}
        run: |
          for f in $ACCOUNT_FILES; do
            [ -f "$RUNNER_TEMP/account-before/$f" ] || continue
            aws s3 cp "$RUNNER_TEMP/account-before/$f" "s3://$BUCKET/$f" --endpoint-url "$ENDPOINT" --cache-control "no-cache" --no-progress
          done
      - name: Все файлы сайта
        if: ${{ !inputs.check_only && !inputs.accounts_only }}
        run: |
          exclusions=()
          while IFS= read -r pattern || [ -n "$pattern" ]; do
            [ -z "$pattern" ] || exclusions+=(--exclude "$pattern")
          done < deploy/site-excludes.txt
          aws s3 sync . "s3://$BUCKET" --endpoint-url "$ENDPOINT" --delete --size-only --no-progress "${exclusions[@]}" --cache-control "public, max-age=300"
          for f in sw.js index.html js/accounts-config.js; do
            aws s3 cp "$f" "s3://$BUCKET/$f" --endpoint-url "$ENDPOINT" --cache-control "no-cache" --no-progress
          done
