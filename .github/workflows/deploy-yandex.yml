name: Выкладка материалов уроков в Яндекс Облако
on:
  workflow_dispatch:
concurrency:
  group: deploy-yandex
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET }}
      AWS_DEFAULT_REGION: ru-central1
      BUCKET: uchu-po-frp.ru
      ENDPOINT: https://storage.yandexcloud.net
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2b998f7e089e3e9c0410007edaf045cc3fbb7715
          fetch-depth: 2
      - name: Проверка списка обновлений
        run: |
          git diff --diff-filter=AM --name-only HEAD^ HEAD -- vendor/html2pdf.bundle.min.js vendor/html2pdf.bundle.min.js.LICENSE.txt > "$RUNNER_TEMP/lesson-files"
          git diff --diff-filter=M --name-only HEAD^ HEAD -- js >> "$RUNNER_TEMP/lesson-files"
          test "$(wc -l < "$RUNNER_TEMP/lesson-files")" -eq 8
          while IFS= read -r file; do
            case "$file" in
              js/*.js|vendor/html2pdf.bundle.min.js|vendor/html2pdf.bundle.min.js.LICENSE.txt) test -f "$file" ;;
              *) exit 1 ;;
            esac
          done < "$RUNNER_TEMP/lesson-files"
      - name: Сохранить текущие файлы и метаданные
        run: |
          while IFS= read -r file; do
            target="$RUNNER_TEMP/previous/$file"
            mkdir -p "$(dirname "$target")"
            if ! aws s3api get-object --bucket "$BUCKET" --key "$file" --endpoint-url "$ENDPOINT" "$target" > "$target.metadata" 2>"$RUNNER_TEMP/backup-error"; then
              if [[ "$file" == vendor/html2pdf.bundle.min.js* ]] && grep -Eq 'NoSuchKey|\(404\)|Not Found' "$RUNNER_TEMP/backup-error"; then
                rm -f "$target.metadata"
              else
                cat "$RUNNER_TEMP/backup-error"
                exit 1
              fi
            fi
          done < "$RUNNER_TEMP/lesson-files"
      - uses: actions/upload-artifact@v4
        with:
          name: lesson-assets-before
          path: ${{ runner.temp }}/previous
          retention-days: 14
      - name: Обновить и сверить предметные файлы
        run: |
          restore() {
            original_status=$?
            trap - ERR
            set +e
            while IFS= read -r file; do
              source="$RUNNER_TEMP/previous/$file"
              [ -f "$source.metadata" ] || continue
              type=$(jq -r '.ContentType // "application/octet-stream"' "$source.metadata")
              cache=$(jq -r '.CacheControl // "no-cache"' "$source.metadata")
              aws s3 cp "$source" "s3://$BUCKET/$file" --endpoint-url "$ENDPOINT" --no-progress --content-type "$type" --cache-control "$cache" || echo "::error::Не удалось восстановить $file"
            done < "$RUNNER_TEMP/attempted"
            exit "$original_status"
          }
          touch "$RUNNER_TEMP/attempted"
          trap restore ERR
          while IFS= read -r file; do
            case "$file" in
              *.js) type=application/javascript ;;
              *.txt) type=text/plain ;;
            esac
            printf '%s\n' "$file" >> "$RUNNER_TEMP/attempted"
            aws s3 cp "$file" "s3://$BUCKET/$file" --endpoint-url "$ENDPOINT" --no-progress --content-type "$type" --cache-control "no-cache"
          done < "$RUNNER_TEMP/lesson-files"
          while IFS= read -r file; do
            aws s3api get-object --bucket "$BUCKET" --key "$file" --endpoint-url "$ENDPOINT" "$RUNNER_TEMP/lesson-verify" >/dev/null
            cmp "$file" "$RUNNER_TEMP/lesson-verify"
          done < "$RUNNER_TEMP/lesson-files"
