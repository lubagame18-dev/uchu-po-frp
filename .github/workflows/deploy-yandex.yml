name: Выкладка сайта в Яндекс Облако

# Выкладка в бакет Object Storage «uchu-po-frp.ru» — только вручную.
# Ключи – в секретах репозитория: YC_KEY_ID и YC_SECRET (статический ключ сервисного аккаунта с ролью storage.editor).

on:
  # Автодеплой отключён: каждый push создавал тысячи PUT-запросов в Object Storage.
  # Выкладка только вручную: Actions → Выкладка сайта в Яндекс Облако → Run workflow.
  workflow_dispatch:

concurrency:
  group: deploy-yandex
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET }}
      AWS_DEFAULT_REGION: ru-central1
      BUCKET: uchu-po-frp.ru
      ENDPOINT: https://storage.yandexcloud.net
    steps:
      - name: Есть ли ключи
        id: keys
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "Ключи YC_KEY_ID / YC_SECRET не заданы – выкладка пропущена"; fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.ok == '1'

      - name: Копирование в бакет (только файлы сайта)
        if: steps.keys.outputs.ok == '1'
        run: |
          # --size-only: не перезаливать неизменённые 11 000+ файлов уроков при каждом деплое
          aws s3 sync . "s3://$BUCKET" --endpoint-url "$ENDPOINT" --delete --size-only --no-progress \
            --exclude ".git/*" --exclude ".github/*" --exclude "proxy/*" --exclude "api/*" --exclude "docs/*" --exclude "knowledge-base/*" --exclude "knowledge/*" --exclude "presentation_database/*" --exclude "frp_tasks/*" --exclude "integrations/*" --exclude "tools/*" --exclude "test/*" --exclude "deploy/*" \
            --exclude "*.md" --exclude "*.sql" --exclude "*.zip" --exclude "uchu-function.zip" --exclude "wrangler.toml" --exclude "vercel.json" --exclude "_worker.js" \
            --exclude ".assetsignore" --exclude ".nojekyll" --exclude "CNAME" --exclude ".gitignore" \
            --cache-control "public, max-age=300"
          # служебный файл офлайн-режима и главная – всегда свежие
          for f in sw.js index.html; do
            aws s3 cp "$f" "s3://$BUCKET/$f" --endpoint-url "$ENDPOINT" --cache-control "no-cache" --no-progress
          done
