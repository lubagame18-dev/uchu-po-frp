name: Точечная выкладка сайта
on:
  workflow_dispatch:
concurrency:
  group: deploy-yandex
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET }}
      AWS_DEFAULT_REGION: ru-central1
      BUCKET: uchu-po-frp.ru
      ENDPOINT: https://storage.yandexcloud.net
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f5a52d0a21e840fc1a1b61650a902de5ebb88c00
          fetch-depth: 2
      - name: Сверить список обновлений
        run: |
          printf '%s\n' css/v5.css js/app-part2.js index.html sw.js > "$RUNNER_TEMP/release-files"
          git diff --diff-filter=M --name-only HEAD^ HEAD -- js css index.html sw.js | cmp - <(sort "$RUNNER_TEMP/release-files")
          while IFS= read -r file; do
            if [[ "$file" == *.js ]]; then node --check "$file"; fi
          done < "$RUNNER_TEMP/release-files"
      - name: Сохранить действующие файлы и метаданные
        run: |
          while IFS= read -r file; do
            target="$RUNNER_TEMP/release-before/$file"
            mkdir -p "$(dirname "$target")"
            aws s3api get-object --bucket "$BUCKET" --key "$file" --endpoint-url "$ENDPOINT" "$target" > "$target.metadata"
            git show "HEAD^:$file" | cmp - "$target" || { echo "::error::На сайте обнаружена более свежая версия $file"; exit 1; }
          done < "$RUNNER_TEMP/release-files"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-before
          path: ${{ runner.temp }}/release-before
          retention-days: 14
      - name: Загрузить и сверить содержимое файлов
        run: |
          restore() {
            original_status=$?
            trap - ERR
            set +e
            while IFS= read -r file; do
              source="$RUNNER_TEMP/release-before/$file"
              type=$(jq -r '.ContentType // "application/octet-stream"' "$source.metadata")
              cache=$(jq -r '.CacheControl // "no-cache"' "$source.metadata")
              aws s3 cp "$source" "s3://$BUCKET/$file" --endpoint-url "$ENDPOINT" --no-progress --content-type "$type" --cache-control "$cache" || echo "::error::Не удалось восстановить $file"
            done < "$RUNNER_TEMP/attempted"
            exit "$original_status"
          }
          touch "$RUNNER_TEMP/attempted"
          trap restore ERR
          while IFS= read -r file; do
            case "$file" in
              *.js) type=application/javascript ;;
              *.css) type=text/css ;;
              *.html) type="text/html; charset=utf-8" ;;
            esac
            printf '%s\n' "$file" >> "$RUNNER_TEMP/attempted"
            aws s3 cp "$file" "s3://$BUCKET/$file" --endpoint-url "$ENDPOINT" --no-progress --content-type "$type" --cache-control "no-cache"
            aws s3api get-object --bucket "$BUCKET" --key "$file" --endpoint-url "$ENDPOINT" "$RUNNER_TEMP/release-readback" >/dev/null
            cmp "$file" "$RUNNER_TEMP/release-readback"
          done < "$RUNNER_TEMP/release-files"
