name: Выкладка правок к слайдам и ФРП
on:
  workflow_dispatch:
concurrency:
  group: deploy-yandex
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET }}
      AWS_DEFAULT_REGION: ru-central1
      BUCKET: uchu-po-frp.ru
      ENDPOINT: https://storage.yandexcloud.net
    steps:
      - uses: actions/checkout@v4
        with:
          ref: daa0ef697ededa683f0817e684111180dde8640b
          fetch-depth: 2
      - name: Сверить список обновлений
        run: |
          printf '%s\n' js/subjects.js js/litkit.js js/app-part1.js js/app-part2.js js/biokit.js js/deck.js js/frpkit.js js/geomethod.js js/histkit.js js/lessonnotes.js js/plans-loader.js js/quizlink.js js/slides.js js/variety.js sw.js > "$RUNNER_TEMP/presentation-files"
          git diff --diff-filter=M --name-only HEAD^ HEAD -- js/subjects.js js/litkit.js js/app-part1.js js/app-part2.js js/biokit.js js/deck.js js/frpkit.js js/geomethod.js js/histkit.js js/lessonnotes.js js/plans-loader.js js/quizlink.js js/slides.js js/variety.js sw.js | cmp - <(sort "$RUNNER_TEMP/presentation-files")
          for file in js/subjects.js js/litkit.js js/app-part1.js js/app-part2.js js/biokit.js js/deck.js js/frpkit.js js/geomethod.js js/histkit.js js/lessonnotes.js js/plans-loader.js js/quizlink.js js/slides.js js/variety.js sw.js; do node --check "$file"; done
      - name: Сохранить действующие файлы и метаданные
        run: |
          while IFS= read -r file; do
            target="$RUNNER_TEMP/presentation-before/$file"
            mkdir -p "$(dirname "$target")"
            aws s3api get-object --bucket "$BUCKET" --key "$file" --endpoint-url "$ENDPOINT" "$target" > "$target.metadata"
            git show "HEAD^:$file" | cmp - "$target" || { echo "::error::На сайте обнаружена более свежая версия $file"; exit 1; }
          done < "$RUNNER_TEMP/presentation-files"
      - uses: actions/upload-artifact@v4
        with:
          name: presentation-assets-before
          path: ${{ runner.temp }}/presentation-before
          retention-days: 14
      - name: Загрузить и сверить содержимое файлов
        run: |
          restore() {
            original_status=$?
            trap - ERR
            set +e
            while IFS= read -r file; do
              source="$RUNNER_TEMP/presentation-before/$file"
              type=$(jq -r '.ContentType // "application/octet-stream"' "$source.metadata")
              cache=$(jq -r '.CacheControl // "no-cache"' "$source.metadata")
              aws s3 cp "$source" "s3://$BUCKET/$file" --endpoint-url "$ENDPOINT" --no-progress --content-type "$type" --cache-control "$cache" || echo "::error::Не удалось восстановить $file"
            done < "$RUNNER_TEMP/attempted"
            exit "$original_status"
          }
          touch "$RUNNER_TEMP/attempted"
          trap restore ERR
          while IFS= read -r file; do
            case "$file" in
              *.js) type=application/javascript ;;
              *.css) type=text/css ;;
            esac
            printf '%s\n' "$file" >> "$RUNNER_TEMP/attempted"
            aws s3 cp "$file" "s3://$BUCKET/$file" --endpoint-url "$ENDPOINT" --no-progress --content-type "$type" --cache-control "no-cache"
            aws s3api get-object --bucket "$BUCKET" --key "$file" --endpoint-url "$ENDPOINT" "$RUNNER_TEMP/presentation-readback" >/dev/null
            cmp "$file" "$RUNNER_TEMP/presentation-readback"
          done < "$RUNNER_TEMP/presentation-files"
