name: Render all Russian lesson visuals
on:
  push:
    branches: [main]
    paths:
      - 'presentation_database/render_all_russian.py'
      - 'frp_tasks/ru.json'
      - '.github/workflows/render_all_russian.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==11.3.0
      - run: python presentation_database/render_all_russian.py
      - name: Commit visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentation_database/russian_all_grades/
          if ! git diff --cached --quiet; then
            git commit -m "Generate Russian lesson visual database for grades 1-11"
            git push
          fi
