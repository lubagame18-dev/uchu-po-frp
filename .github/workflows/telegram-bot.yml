name: Telegram bot

# Бот «Учу по ФРП» опрашивает Telegram из инфраструктуры GitHub:
# сеть GitHub видит api.telegram.org, а функция Яндекс.Облака — нет.
# Один запуск работает почти непрерывно (~5 ч 45 мин), расписание перезапускает его.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Восстановить смещение обновлений
        uses: actions/cache@v4
        with:
          path: .tg-offset.json
          key: tg-offset-${{ github.run_id }}
          restore-keys: |
            tg-offset-

      - name: Опрос Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RUN_LIMIT_MIN: "340"
        run: node tools/tg-poll.cjs

      - name: Сохранить смещение обновлений
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .tg-offset.json
          key: tg-offset-${{ github.run_id }}
  max:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Восстановить маркер обновлений MAX
        uses: actions/cache@v4
        with:
          path: .max-marker.json
          key: max-marker-${{ github.run_id }}
          restore-keys: |
            max-marker-

      - name: Опрос MAX
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          NODE_EXTRA_CA_CERTS: tools/russian_ca.pem
          RUN_LIMIT_MIN: "340"
        run: node tools/max-poll.cjs

      - name: Сохранить маркер обновлений MAX
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .max-marker.json
          key: max-marker-${{ github.run_id }}