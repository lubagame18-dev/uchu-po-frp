name: База портретов (Викиданные и Викисклад)

# Собирает портреты авторов и исторических деятелей из открытых источников по спискам tools/people/*.txt
on:
  push:
    branches: [main]
    paths: ["tools/people/*.txt", "tools/people/fetch.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: people-portraits
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: Сбор портретов
        run: python3 tools/people/fetch.py
      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add img/people data/people.js tools/people/report.txt
          git diff --cached --quiet && { echo "без изменений"; exit 0; }
          git commit -m "База портретов: авторы и исторические деятели (Викиданные, Викисклад)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
