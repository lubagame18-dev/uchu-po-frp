name: Deploy Mandelstam biography page to Yandex Cloud
on:
  push:
    branches: [main]
    paths:
      - 'mandelstam-bio/index.html'
      - '.github/workflows/deploy-mandelstam-bio.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-mandelstam-bio
  cancel-in-progress: false
jobs:
  deploy-single-page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET }}
      AWS_DEFAULT_REGION: ru-central1
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Check credentials
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY"
          test -s mandelstam-bio/index.html
      - name: Cache historical photographs from Wikimedia Commons
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mandel-images"
          curl -fsSL --retry 3 --retry-delay 2 'https://upload.wikimedia.org/wikipedia/commons/8/8d/Osip_Mandelstam_Russian_writer.jpg' -o "$RUNNER_TEMP/mandel-images/osip-1914.jpg"
          curl -fsSL --retry 3 --retry-delay 2 'https://commons.wikimedia.org/wiki/Special:FilePath/Osip_Mandelstam_1934.jpg' -o "$RUNNER_TEMP/mandel-images/osip-1934.jpg"
          curl -fsSL --retry 3 --retry-delay 2 'https://commons.wikimedia.org/wiki/Special:FilePath/Nevsky_prospect_and_Gostiny_dvor_in_1900s.jpg' -o "$RUNNER_TEMP/mandel-images/petersburg.jpg"
          curl -fsSL --retry 3 --retry-delay 2 'https://upload.wikimedia.org/wikipedia/commons/5/5b/%D0%9D%D0%B0%D0%B4%D0%B5%CC%81%D0%B6%D0%B4%D0%B0_%D0%AF%CC%81%D0%BA%D0%BE%D0%B2%D0%BB%D0%B5%D0%B2%D0%BD%D0%B0_%D0%9C%D0%B0%D0%BD%D0%B4%D0%B5%D0%BB%D1%8C%D1%88%D1%82%D0%B0%CC%81%D0%BC.jpg' -o "$RUNNER_TEMP/mandel-images/nadezhda-1925.jpg"
          curl -fsSL --retry 3 --retry-delay 2 'https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7c/%D0%9C%D0%BE%D1%85%D0%BE%D0%B2%D0%B0%D1%8F_33-35_03.jpg/960px-%D0%9C%D0%BE%D1%85%D0%BE%D0%B2%D0%B0%D1%8F_33-35_03.jpg' -o "$RUNNER_TEMP/mandel-images/tenishev-2016.jpg"
          for f in "$RUNNER_TEMP"/mandel-images/*.jpg; do
            test "$(wc -c < "$f")" -gt 3500
            aws s3 cp "$f" "s3://uchu-po-frp.ru/mandelstam-bio/img/$(basename "$f")" \
              --endpoint-url https://storage.yandexcloud.net \
              --content-type image/jpeg --cache-control 'public, max-age=86400' --no-progress
          done
      - name: Upload only biography page
        run: |
          aws s3 cp mandelstam-bio/index.html s3://uchu-po-frp.ru/mandelstam-bio/index.html \
            --endpoint-url https://storage.yandexcloud.net \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'public, max-age=120' --no-progress
