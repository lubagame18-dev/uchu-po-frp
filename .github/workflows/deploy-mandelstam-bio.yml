name: Deploy Mandelstam biography page to Yandex Cloud
on:
  push:
    branches: [main]
    paths:
      - 'mandelstam-bio/index.html'
      - 'mandelstam-bio/pdf/**'
      - 'mandelstam-bio/img/archive-*.webp'
      - '.github/workflows/deploy-mandelstam-bio.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-mandelstam-bio
  cancel-in-progress: false
jobs:
  deploy-single-page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET }}
      AWS_DEFAULT_REGION: ru-central1
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Check credentials
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY"
          test -s mandelstam-bio/index.html
      - name: Upload archived lesson illustrations
        run: |
          set -euo pipefail
          for image in mandelstam-bio/img/archive-*.webp; do
            aws s3 cp "$image" "s3://uchu-po-frp.ru/$image" \
              --endpoint-url https://storage.yandexcloud.net \
              --content-type image/webp --cache-control 'public, max-age=86400' --no-progress
          done
      - name: Upload PDF export dependencies
        run: |
          aws s3 cp mandelstam-bio/pdf/ s3://uchu-po-frp.ru/mandelstam-bio/pdf/ \
            --recursive --endpoint-url https://storage.yandexcloud.net --no-progress
      - name: Cache historical photographs from Wikimedia Commons
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mandel-images"
          curl -fsSL --retry 3 --retry-delay 2 'https://upload.wikimedia.org/wikipedia/commons/8/8d/Osip_Mandelstam_Russian_writer.jpg' -o "$RUNNER_TEMP/mandel-images/osip-1914.jpg"
          curl -fsSL --retry 3 --retry-delay 2 'https://commons.wikimedia.org/wiki/Special:FilePath/Osip_Mandelstam_1934.jpg' -o "$RUNNER_TEMP/mandel-images/osip-1934.jpg"
          curl -fsSL --retry 3 --retry-delay 2 'https://commons.wikimedia.org/wiki/Special:FilePath/Nevsky_prospect_and_Gostiny_dvor_in_1900s.jpg' -o "$RUNNER_TEMP/mandel-images/petersburg.jpg"
          curl -fsSL --retry 3 --retry-delay 2 'https://upload.wikimedia.org/wikipedia/commons/5/5b/%D0%9D%D0%B0%D0%B4%D0%B5%CC%81%D0%B6%D0%B4%D0%B0_%D0%AF%CC%81%D0%BA%D0%BE%D0%B2%D0%BB%D0%B5%D0%B2%D0%BD%D0%B0_%D0%9C%D0%B0%D0%BD%D0%B4%D0%B5%D0%BB%D1%8C%D1%88%D1%82%D0%B0%CC%81%D0%BC.jpg' -o "$RUNNER_TEMP/mandel-images/nadezhda-1925.jpg"
          curl -fsSL --retry 3 --retry-delay 2 'https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7c/%D0%9C%D0%BE%D1%85%D0%BE%D0%B2%D0%B0%D1%8F_33-35_03.jpg/960px-%D0%9C%D0%BE%D1%85%D0%BE%D0%B2%D0%B0%D1%8F_33-35_03.jpg' -o "$RUNNER_TEMP/mandel-images/tenishev-2016.jpg"
          curl -fsSL --retry 3 --retry-delay 2 'https://upload.wikimedia.org/wikipedia/commons/d/d2/Mandelstam%2C_Chukovsky%2C_Livshits_%26_Annenkov_1914_Karl_Bulla_%28with_smile%29.jpg' -o "$RUNNER_TEMP/mandel-images/literary-circle-1914.jpg"
          curl -fsSL --retry 3 --retry-delay 2 'https://upload.wikimedia.org/wikipedia/commons/e/e6/Om1923.jpg' -o "$RUNNER_TEMP/mandel-images/osip-1925.jpg"
          curl -fsSL --retry 3 --retry-delay 2 'https://upload.wikimedia.org/wikipedia/commons/5/56/Chulkov_Petrovykh_Akhmatova_Mandelstam.jpg' -o "$RUNNER_TEMP/mandel-images/literary-circle-1930s.jpg"
          curl -fsSL --retry 3 --retry-delay 2 'https://commons.wikimedia.org/wiki/Special:FilePath/Anna_Akhmatova_(1912).jpg' -o "$RUNNER_TEMP/mandel-images/akhmatova-1912.jpg"
          curl -fsSL --retry 3 --retry-delay 2 'https://commons.wikimedia.org/wiki/Special:FilePath/Nikolay_Gumilyov1.jpg' -o "$RUNNER_TEMP/mandel-images/gumilev-1907.jpg"
          curl -fsSL --retry 3 --retry-delay 2 'https://commons.wikimedia.org/wiki/Special:FilePath/MP_tram_Petersburg.jpg' -o "$RUNNER_TEMP/mandel-images/leningrad-1933.jpg"
          for f in "$RUNNER_TEMP"/mandel-images/*.jpg; do
            test "$(wc -c < "$f")" -gt 3500
            aws s3 cp "$f" "s3://uchu-po-frp.ru/mandelstam-bio/img/$(basename "$f")" \
              --endpoint-url https://storage.yandexcloud.net \
              --content-type image/jpeg --cache-control 'public, max-age=86400' --no-progress
          done
      - name: Create licensed Bach organ excerpt and upload MP3
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mandel-audio"
          curl -fL --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 120 \
            'https://upload.wikimedia.org/wikipedia/commons/d/d3/Rapha%C3%ABle_Garreau_de_Labarre_-_Bach_-_Wachet_auf%2C_ruft_uns_die_Stimme_-_28-07-2013.ogg' \
            -o "$RUNNER_TEMP/mandel-audio/bach-source.ogg"
          test "$(wc -c < "$RUNNER_TEMP/mandel-audio/bach-source.ogg")" -gt 3000000
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg; }
          command -v ffmpeg
          ffmpeg -nostdin -hide_banner -loglevel error -y -i "$RUNNER_TEMP/mandel-audio/bach-source.ogg" \
            -t 70 -codec:a libmp3lame -qscale:a 4 \
            "$RUNNER_TEMP/mandel-audio/bach-bwv645-excerpt.mp3"
          test "$(wc -c < "$RUNNER_TEMP/mandel-audio/bach-bwv645-excerpt.mp3")" -gt 300000
          aws s3 cp "$RUNNER_TEMP/mandel-audio/bach-bwv645-excerpt.mp3" \
            "s3://uchu-po-frp.ru/mandelstam-bio/audio/bach-bwv645-excerpt.mp3" \
            --endpoint-url https://storage.yandexcloud.net \
            --content-type "audio/mpeg" --cache-control "public, max-age=86400" --no-progress
      - name: Upload only biography page
        run: |
          aws s3 cp mandelstam-bio/index.html s3://uchu-po-frp.ru/mandelstam-bio/index.html \
            --endpoint-url https://storage.yandexcloud.net \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'public, max-age=120' --no-progress
      - name: Verify published object and public page
        run: |
          set -euo pipefail
          aws s3api head-object --bucket uchu-po-frp.ru --key mandelstam-bio/index.html --endpoint-url https://storage.yandexcloud.net --query 'ContentLength' --output text
          for key in osip-1914.jpg osip-1934.jpg petersburg.jpg nadezhda-1925.jpg tenishev-2016.jpg literary-circle-1914.jpg osip-1925.jpg literary-circle-1930s.jpg akhmatova-1912.jpg gumilev-1907.jpg leningrad-1933.jpg; do
            aws s3api head-object --bucket uchu-po-frp.ru --key "mandelstam-bio/img/$key" --endpoint-url https://storage.yandexcloud.net --query 'ContentLength' --output text
          done
          for image in mandelstam-bio/img/archive-*.webp; do
            aws s3api head-object --bucket uchu-po-frp.ru --key "$image" --endpoint-url https://storage.yandexcloud.net --query 'ContentLength' --output text
          done
          aws s3api head-object --bucket uchu-po-frp.ru --key "mandelstam-bio/audio/bach-bwv645-excerpt.mp3" --endpoint-url https://storage.yandexcloud.net --query '{Length:ContentLength,Type:ContentType}' --output json
          http=$(curl -L --connect-timeout 10 --max-time 25 -sS -o "$RUNNER_TEMP/mandel-live.html" -w '%{http_code}' 'https://uchu-po-frp.ru/mandelstam-bio/index.html' || true)
          echo "Public page HTTP status: $http"
          test "$http" = "200"
          grep -q 'Осип Мандельштам' "$RUNNER_TEMP/mandel-live.html"
