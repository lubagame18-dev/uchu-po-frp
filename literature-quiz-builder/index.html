<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Конструктор тестов по литературе</title><style>*{box-sizing:border-box}body{margin:0;--dark:#291519;--light:#f5ebd5;--accent:#e6bf73;--ink:#362128;background:var(--dark);color:var(--light);font:18px/1.5 Georgia,serif}body[data-palette=winter]{--dark:#182638;--light:#f3f5f9;--accent:#bcd7ee;--ink:#1c3044}body[data-palette=forest]{--dark:#203329;--light:#f2f1db;--accent:#cedb9f;--ink:#243728}body[data-palette=ink]{--dark:#242129;--light:#f8eff4;--accent:#ecc1d3;--ink:#372333}main{max-width:760px;margin:auto;padding:clamp(12px,4vw,36px)}header,section,form{padding:clamp(17px,4vw,34px);border-radius:18px;margin-bottom:18px}header{border:1px solid var(--accent);background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 15%,var(--dark)),var(--dark));padding-block:clamp(28px,9vw,78px)}h1,h2,p{margin:0 0 12px}h1{font-size:clamp(35px,8vw,66px);line-height:1.05;font-weight:normal}h2{font-size:27px}a{color:var(--accent)}section,form{background:var(--light);color:var(--ink)}fieldset{border:0;padding:0;margin:16px 0 24px;min-width:0}legend{font-weight:bold;padding:0}label{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:7px 0;border:1px solid #867e7e;border-radius:9px;min-height:44px;cursor:pointer}label:has(input:checked){outline:2px solid var(--ink);background:var(--accent)}input{accent-color:var(--ink);flex:none}button{font:inherit;padding:10px 17px;border:0;border-radius:8px;background:var(--dark);color:var(--light);cursor:pointer}button:focus-visible,a:focus-visible,label:focus-within{outline:3px solid #a77d33;outline-offset:2px}.correct,.incorrect{padding:8px;border-left:4px solid #326149;background:#fff}.incorrect{border-color:#8d353d}[hidden]{display:none!important} textarea{width:100%;min-height:290px;background:#fff;color:#21242a;font:15px/1.4 monospace;padding:10px} iframe{width:100%;height:660px;border:1px solid var(--accent);border-radius:12px} .actions{display:flex;gap:8px;flex-wrap:wrap}</style><body data-palette="ink"><main><header><h1>Конструктор тестов</h1><p>Подготовьте тест по литературе и скачайте готовую страницу для публикации.</p></header><section><h2><label for="lesson" style="border:0;padding:0">Данные теста</label></h2><p>Замените пример своим уроком. Палитры: winter, forest, ink, wine. В поле answer укажите номер варианта, начиная с 0.</p><textarea id="lesson" spellcheck="false"></textarea><div class="actions"><button id="preview">Обновить просмотр</button><button id="download">Скачать HTML</button></div><p role="status"></p></section><iframe title="Предпросмотр теста" sandbox="allow-scripts"></iframe></main><script>(function(demo,runtime,css,build){
const box=document.querySelector("textarea");box.value=JSON.stringify(demo,null,2);
const msg=document.querySelector("[role=status]");
let current="";
function refresh(){
 try{
 const d=JSON.parse(box.value);
 const nonempty=x=>typeof x==="string"&&x.trim();
 if(!["title","author","grade","intro"].every(k=>nonempty(d[k])))throw Error("Заполните title, author, grade и intro.");
 if(!["winter","forest","ink","wine"].includes(d.palette))throw Error("Выберите палитру winter, forest, ink или wine.");
 if(d.source&&!/^https:\/\/[^\s]+$/.test(d.source))throw Error("Ссылка на источник должна начинаться с https://.");
 if(!Array.isArray(d.cards)||!d.cards.every(c=>c&&nonempty(c.title)&&nonempty(c.text)))throw Error("Каждая карточка должна содержать title и text.");
 if(!Array.isArray(d.questions)||!d.questions.length||!d.questions.every(q=>q&&nonempty(q.text)&&nonempty(q.feedback)&&Array.isArray(q.options)&&q.options.length>=2&&q.options.every(nonempty)&&new Set(q.options.map(o=>o.trim())).size===q.options.length&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length))throw Error("Проверьте вопросы, уникальность вариантов, пояснения и номер правильного ответа. Нумерация вариантов начинается с 0.");
 current=build(d,runtime,css);document.querySelector("iframe").srcdoc=current;msg.textContent="Предпросмотр обновлён.";return true;
 }catch(e){current="";msg.textContent=e.message;return false;}
}
document.querySelector("#preview").onclick=refresh;
document.querySelector("#download").onclick=()=>{if(!refresh())return;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([current],{type:"text/html;charset=utf-8"}));a.download="index.html";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
refresh();
})({"title":"Финал поэмы «Двенадцать»","author":"Александр Блок","grade":"11 класс","palette":"winter","intro":"Проследите, как поэт выстраивает финальную сцену. Опирайтесь на XII главу.","source":"https://ru.wikisource.org/wiki/Двенадцать_(Блок)","cards":[{"title":"Перед тестом","text":"Перечитайте XII главу. Отметьте, кто или что находится позади отряда и кто появляется впереди. Сопоставьте детали, которыми поэт обозначает эти образы."}],"questions":[{"text":"Кого поэт помещает позади отряда в финальных строках?","options":["Иисуса Христа","Голодного пса","Старушку"],"answer":1,"feedback":"Голодный пёс остаётся позади, тогда как Иисус Христос появляется впереди."},{"text":"Какая деталь относится к образу Христа в финале?","options":["Белый венчик из роз","Старое пальто","Чёрный ремень"],"answer":0,"feedback":"Белый венчик из роз назван непосредственно перед именем Христа."},{"text":"Как построено пространство в финальных строках?","options":["Все фигуры собраны в одной точке","Отряд и Христос движутся навстречу друг другу","Позади отряда — пёс, впереди — Христос"],"answer":2,"feedback":"Повтор указания на передний план удерживает внимание на фигуре Христа. Положение пса задаёт противоположный край сцены."},{"text":"Какой вывод лучше всего опирается на текст?","options":["Христос произносит речь перед отрядом","Поэт завершает движение отряда появлением Христа, чей образ раскрывается через детали и положение в сцене","Последние строки прямо объясняют, как следует оценить каждый поступок отряда"],"answer":1,"feedback":"В финале нет речи Христа или прямого пояснения. Читатель интерпретирует композицию и детали образа."}]},function(d){
const root=document.querySelector("main");
function el(tag,s,parent=root){const n=document.createElement(tag);if(s)n.textContent=s;parent.append(n);return n;}
document.title=d.title;document.body.dataset.palette=d.palette;
const h=el("header");el("p",d.grade+" · "+d.author,h);el("h1",d.title,h);el("p",d.intro,h);
if(d.source){const a=el("a","Открыть текст произведения",h);a.href=d.source;a.target="_blank";a.rel="noopener";}
for(const c of d.cards){const s=el("section");el("h2",c.title,s);el("p",c.text,s);}
const form=el("form");el("h2","Тест после урока",form);
const groups=d.questions.map((q,i)=>{const f=el("fieldset","",form);el("legend",`${i+1}. ${q.text}`,f);for(const [j,o] of q.options.entries()){const l=el("label","",f);const input=el("input","",l);input.type="radio";input.name="q"+i;input.value=j;input.required=true;l.append(document.createTextNode(o));}return el("p","",f);});
const check=el("button","Проверить ответы",form);const reset=el("button","Пройти заново",form);reset.type="reset";reset.hidden=true;
const output=el("p","",form);output.setAttribute("role","status");output.tabIndex=-1;
form.addEventListener("submit",e=>{e.preventDefault();const values=new FormData(form);let score=0;d.questions.forEach((q,i)=>{const correct=Number(values.get("q"+i))===q.answer;score+=Number(correct);groups[i].textContent=(correct?"Верно. ":"Правильный ответ — "+q.options[q.answer]+". ")+q.feedback;groups[i].className=correct?"correct":"incorrect";});for(const f of form.querySelectorAll("fieldset"))f.disabled=true;check.hidden=true;reset.hidden=false;output.textContent=`Результат: ${score} из ${d.questions.length}`;output.focus();});
form.addEventListener("reset",()=>{for(const f of form.querySelectorAll("fieldset"))f.disabled=false;for(const g of groups){g.textContent="";g.className="";}check.hidden=false;reset.hidden=true;output.textContent="";check.focus();});
},"*{box-sizing:border-box}body{margin:0;--dark:#291519;--light:#f5ebd5;--accent:#e6bf73;--ink:#362128;background:var(--dark);color:var(--light);font:18px/1.5 Georgia,serif}body[data-palette=winter]{--dark:#182638;--light:#f3f5f9;--accent:#bcd7ee;--ink:#1c3044}body[data-palette=forest]{--dark:#203329;--light:#f2f1db;--accent:#cedb9f;--ink:#243728}body[data-palette=ink]{--dark:#242129;--light:#f8eff4;--accent:#ecc1d3;--ink:#372333}main{max-width:760px;margin:auto;padding:clamp(12px,4vw,36px)}header,section,form{padding:clamp(17px,4vw,34px);border-radius:18px;margin-bottom:18px}header{border:1px solid var(--accent);background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 15%,var(--dark)),var(--dark));padding-block:clamp(28px,9vw,78px)}h1,h2,p{margin:0 0 12px}h1{font-size:clamp(35px,8vw,66px);line-height:1.05;font-weight:normal}h2{font-size:27px}a{color:var(--accent)}section,form{background:var(--light);color:var(--ink)}fieldset{border:0;padding:0;margin:16px 0 24px;min-width:0}legend{font-weight:bold;padding:0}label{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:7px 0;border:1px solid #867e7e;border-radius:9px;min-height:44px;cursor:pointer}label:has(input:checked){outline:2px solid var(--ink);background:var(--accent)}input{accent-color:var(--ink);flex:none}button{font:inherit;padding:10px 17px;border:0;border-radius:8px;background:var(--dark);color:var(--light);cursor:pointer}button:focus-visible,a:focus-visible,label:focus-within{outline:3px solid #a77d33;outline-offset:2px}.correct,.incorrect{padding:8px;border-left:4px solid #326149;background:#fff}.incorrect{border-color:#8d353d}[hidden]{display:none!important}",function(d,runtime,css){
const json=JSON.stringify(d).replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");
return '<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тест после урока</title><style>'+css+'</style><main></main><script>('+runtime.toString()+')('+json+');<\/script></html>';
});</script></body></html>
