<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тест после урока</title><style>*{box-sizing:border-box}body{margin:0;--dark:#291519;--light:#f5ebd5;--accent:#e6bf73;--ink:#362128;background:var(--dark);color:var(--light);font:18px/1.5 Georgia,serif}body[data-palette=winter]{--dark:#182638;--light:#f3f5f9;--accent:#bcd7ee;--ink:#1c3044}body[data-palette=forest]{--dark:#203329;--light:#f2f1db;--accent:#cedb9f;--ink:#243728}body[data-palette=ink]{--dark:#242129;--light:#f8eff4;--accent:#ecc1d3;--ink:#372333}main{max-width:760px;margin:auto;padding:clamp(12px,4vw,36px)}header,section,form{padding:clamp(17px,4vw,34px);border-radius:18px;margin-bottom:18px}header{border:1px solid var(--accent);background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 15%,var(--dark)),var(--dark));padding-block:clamp(28px,9vw,78px)}h1,h2,p{margin:0 0 12px}h1{font-size:clamp(35px,8vw,66px);line-height:1.05;font-weight:normal}h2{font-size:27px}a{color:var(--accent)}section,form{background:var(--light);color:var(--ink)}fieldset{border:0;padding:0;margin:16px 0 24px;min-width:0}legend{font-weight:bold;padding:0}label{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:7px 0;border:1px solid #867e7e;border-radius:9px;min-height:44px;cursor:pointer}label:has(input:checked){outline:2px solid var(--ink);background:var(--accent)}input{accent-color:var(--ink);flex:none}button{font:inherit;padding:10px 17px;border:0;border-radius:8px;background:var(--dark);color:var(--light);cursor:pointer}button:focus-visible,a:focus-visible,label:focus-within{outline:3px solid #a77d33;outline-offset:2px}.correct,.incorrect{padding:8px;border-left:4px solid #326149;background:#fff}.incorrect{border-color:#8d353d}[hidden]{display:none!important}</style><main></main><script>(function(d){
const root=document.querySelector("main");
function el(tag,s,parent=root){const n=document.createElement(tag);if(s)n.textContent=s;parent.append(n);return n;}
document.title=d.title;document.body.dataset.palette=d.palette;
const h=el("header");el("p",d.grade+" · "+d.author,h);el("h1",d.title,h);el("p",d.intro,h);
if(d.source){const a=el("a","Открыть текст произведения",h);a.href=d.source;a.target="_blank";a.rel="noopener";}
for(const c of d.cards){const s=el("section");el("h2",c.title,s);el("p",c.text,s);}
const form=el("form");el("h2","Тест после урока",form);
const groups=d.questions.map((q,i)=>{const f=el("fieldset","",form);el("legend",`${i+1}. ${q.text}`,f);for(const [j,o] of q.options.entries()){const l=el("label","",f);const input=el("input","",l);input.type="radio";input.name="q"+i;input.value=j;input.required=true;l.append(document.createTextNode(o));}return el("p","",f);});
const check=el("button","Проверить ответы",form);const reset=el("button","Пройти заново",form);reset.type="reset";reset.hidden=true;
const output=el("p","",form);output.setAttribute("role","status");output.tabIndex=-1;
form.addEventListener("submit",e=>{e.preventDefault();const values=new FormData(form);let score=0;d.questions.forEach((q,i)=>{const correct=Number(values.get("q"+i))===q.answer;score+=Number(correct);groups[i].textContent=(correct?"Верно. ":"Правильный ответ — "+q.options[q.answer]+". ")+q.feedback;groups[i].className=correct?"correct":"incorrect";});for(const f of form.querySelectorAll("fieldset"))f.disabled=true;check.hidden=true;reset.hidden=false;output.textContent=`Результат: ${score} из ${d.questions.length}`;output.focus();});
form.addEventListener("reset",()=>{for(const f of form.querySelectorAll("fieldset"))f.disabled=false;for(const g of groups){g.textContent="";g.className="";}check.hidden=false;reset.hidden=true;output.textContent="";check.focus();});
})({"title":"Финал поэмы «Двенадцать»","author":"Александр Блок","grade":"11 класс","palette":"winter","intro":"Проследите, как поэт выстраивает финальную сцену. Опирайтесь на XII главу.","source":"https://ru.wikisource.org/wiki/Двенадцать_(Блок)","cards":[{"title":"Перед тестом","text":"Перечитайте XII главу. Отметьте, кто или что находится позади отряда и кто появляется впереди. Сопоставьте детали, которыми поэт обозначает эти образы."}],"questions":[{"text":"Кого поэт помещает позади отряда в финальных строках?","options":["Иисуса Христа","Голодного пса","Старушку"],"answer":1,"feedback":"Голодный пёс остаётся позади, тогда как Иисус Христос появляется впереди."},{"text":"Какая деталь относится к образу Христа в финале?","options":["Белый венчик из роз","Старое пальто","Чёрный ремень"],"answer":0,"feedback":"Белый венчик из роз назван непосредственно перед именем Христа."},{"text":"Как построено пространство в финальных строках?","options":["Все фигуры собраны в одной точке","Отряд и Христос движутся навстречу друг другу","Позади отряда — пёс, впереди — Христос"],"answer":2,"feedback":"Повтор указания на передний план удерживает внимание на фигуре Христа. Положение пса задаёт противоположный край сцены."},{"text":"Какой вывод лучше всего опирается на текст?","options":["Христос произносит речь перед отрядом","Поэт завершает движение отряда появлением Христа, чей образ раскрывается через детали и положение в сцене","Последние строки прямо объясняют, как следует оценить каждый поступок отряда"],"answer":1,"feedback":"В финале нет речи Христа или прямого пояснения. Читатель интерпретирует композицию и детали образа."}]});</script></html>
