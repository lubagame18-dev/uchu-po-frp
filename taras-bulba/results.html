<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Результаты – «Тарас Бульба»</title>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--f-title:"Oranienbaum","Times New Roman",serif;--f-text:"PT Serif",Georgia,serif;--wine:#2a0e11;--red:#8e2a2a;--gold:#c9a45c;--paper:#f3e9d7;--paper2:#fbf5ea;--ink:#2a1214;--mute:#6e5550;--line:#d6c3a3;--ok:#2f6b3a;--bad:#9b2c2c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f-text);background:var(--wine);color:var(--ink);font-size:16px;line-height:1.4}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-family:var(--f-title);font-weight:400;font-size:40px;color:var(--paper)}
.sub{color:#d9c6b0;margin-bottom:14px}
.card{background:var(--paper);border-radius:16px;padding:16px;margin-top:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);min-width:0}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--wine);color:var(--paper)}
button.ghost{background:transparent;color:var(--wine);border:1.5px solid var(--wine)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-family:var(--f-title);font-weight:400;font-size:32px;color:var(--wine);line-height:1}
.stat span{font-size:13px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:10px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:700;cursor:pointer;white-space:nowrap}
tr.det td{background:var(--paper2);font-size:14.5px}
.sc{font-family:var(--f-title);font-size:22px}
.lo{color:var(--bad)}.hi{color:var(--ok)}
.msg{margin-top:8px;color:var(--mute);font-size:14px}
.err{color:#9b2c2c;font-weight:700;font-size:15px}
.ok{color:#2f6b3a;font-weight:700}
.dup{font-size:12px;color:var(--mute)}
@media (max-width:640px){.hide-s{display:none}}
</style>
<script src="../js/accounts-config.js"></script>
<script src="../js/accounts-backend.js"></script>
</head>
<body>
<div class="wrap">
  <h1>Результаты урока</h1>
  <p class="sub">«Тарас Бульба», урок 2 · страница для учителя</p>

  <div class="card" id="login">
    <div class="bar"><input id="code" type="password" placeholder="Код учителя" style="flex:1" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"><button class="ghost" id="eye" type="button" title="Показать код">👁</button><button id="go">Показать</button></div>
    <p class="msg">Код задаётся один раз в Supabase (см. инструкцию). Страница запомнит его на этом устройстве.</p>
    <p class="msg err" id="lerr"></p>
  </div>

  <div id="main" style="display:none">
    <div class="card">
      <div class="bar" style="justify-content:space-between">
        <div class="bar"><input id="flt" placeholder="Фильтр: класс или фамилия"><label style="font-size:14px"><input type="checkbox" id="last" checked> только последняя попытка</label></div>
        <div class="bar"><button class="ghost" id="csv">Скачать таблицу</button><button class="ghost" id="ref">Обновить</button></div>
      </div>
      <p class="msg" id="upd"></p>
    </div>
    <div class="card"><div class="stats" id="stats"></div></div>
    <div class="card" style="overflow-x:auto">
      <table><thead><tr><th data-s="student">Ученик</th><th data-s="klass">Класс</th><th data-s="score">Тест</th><th class="hide-s">История</th><th class="hide-s">Сюжет</th><th class="hide-s">Герои</th><th class="hide-s">Выбор</th><th class="hide-s">Идея</th><th data-s="created_at">Время</th></tr></thead><tbody id="tb"></tbody></table>
      <p class="msg">Нажмите на строку – откроются ошибки в тесте и ответ ученика на вопрос урока.</p>
    </div>
  </div>
</div>
<script>
const CLOUD = window.UCHU_ACCOUNTS ? {...AccountsBackend.config(), key: "", lesson: "taras-bulba-2"} : {"url": "https://accounts.uchu-po-frp.ru/api/uchu", "anonKey": "", "key": "", "lesson": "taras-bulba-2"};
const $ = s => document.querySelector(s);
const ls = { get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let rows = [], sortKey = "created_at", sortDir = -1, open = new Set(), timer = null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let goodCode = "";
async function ask(code) {
  let r;
  try { r = await fetch(CLOUD.url + "/rest/v1/rpc/lesson_results_get", { method: "POST", headers: { apikey: CLOUD.key, "Content-Type": "application/json" }, body: JSON.stringify({ p_lesson: CLOUD.lesson, p_code: code }) }); }
  catch { throw new Error("Нет связи с сервером. Проверьте интернет и попробуйте ещё раз."); }
  if (r.ok) return r.json();
  let m = ""; try { const j = await r.json(); m = (j.message || "") + " " + (j.hint || ""); } catch {}
  if (/код/i.test(m)) { const e = new Error("Неверный код учителя."); e.bad = 1; throw e; }
  if (r.status === 404 || /could not find|does not exist/i.test(m)) throw new Error("На сервере ещё нет таблицы результатов: запустите в Supabase файл «Тарас Бульба_результаты_SQL для Supabase.sql» (SQL Editor → Run).");
  throw new Error("Сервер ответил " + r.status + (m.trim() ? ": " + m.trim() : "") + ".");
}
/* код проверяем как введён, а потом без заглавных букв и пробелов (телефон сам ставит заглавную первую букву) */
async function load() {
  if (goodCode) { rows = await ask(goodCode); return rows; }
  const typed = $("#code").value.trim(), variants = [...new Set([typed, typed.toLowerCase(), typed.replace(/\s+/g, ""), typed.toLowerCase().replace(/\s+/g, "")])].filter(Boolean);
  if (!variants.length) throw new Error("Введите код учителя.");
  let last;
  for (const v of variants) { try { rows = await ask(v); goodCode = v; return rows; } catch (e) { last = e; if (!e.bad) throw e; } }
  throw new Error("Неверный код учителя. Проверьте, какой код вы вписали вместо ВАШ_КОД в последней строке SQL (регистр букв и кавычки).");
}
async function enter() {
  $("#lerr").className = "msg"; $("#lerr").textContent = "Проверяю код…"; $("#go").disabled = true; goodCode = "";
  try {
    await load();
    ls.set("tb2code", goodCode);
    $("#login").style.display = "none"; $("#main").style.display = "block";
    draw(); clearInterval(timer); timer = setInterval(() => load().then(draw).catch(() => {}), 15000);
  } catch (e) { $("#lerr").className = "msg err"; $("#lerr").textContent = e.message; try { localStorage.removeItem("tb2code"); } catch {} }
  finally { $("#go").disabled = false; }
}
function view() {
  const f = $("#flt").value.trim().toLowerCase();
  let v = rows.filter(r => !f || (r.student + " " + (r.klass || "")).toLowerCase().includes(f));
  if ($("#last").checked) { const seen = new Map(); v.forEach(r => { const k = (r.student + "|" + (r.klass || "")).toLowerCase(); const p = seen.get(k); if (!p || p.created_at < r.created_at) seen.set(k, r); }); v = [...seen.values()]; }
  return v.sort((a, b) => (a[sortKey] > b[sortKey] ? 1 : a[sortKey] < b[sortKey] ? -1 : 0) * sortDir);
}
function draw() {
  const v = view();
  $("#upd").textContent = `Обновлено ${new Date().toLocaleTimeString("ru")} · обновляется само каждые 15 секунд` + (rows.length ? "" : " · пока нет результатов");
  const n = v.length, avg = n ? (v.reduce((s, r) => s + r.score, 0) / n).toFixed(1) : "—";
  const wr = {}; v.forEach(r => (r.details?.wrong || []).forEach(q => wr[q] = (wr[q] || 0) + 1));
  const hard = Object.entries(wr).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([q, c]) => `№${q} (${c})`).join(", ") || "—";
  $("#stats").innerHTML = `<div class="stat"><b>${n}</b><span>учеников</span></div><div class="stat"><b>${avg}</b><span>средний балл из 12</span></div><div class="stat"><b style="font-size:20px;line-height:1.3">${hard}</b><span>вопросы теста с ошибками</span></div>`;
  $("#tb").innerHTML = v.map(r => { const s = r.details?.sections || {}; const cls = r.score >= 10 ? "hi" : r.score <= 6 ? "lo" : "";
    const main = `<tr data-id="${r.id}" style="cursor:pointer"><td><b>${esc(r.student)}</b></td><td>${esc(r.klass || "")}</td><td class="sc ${cls}">${r.score}/${r.total}</td><td class="hide-s">${esc(s["I. История"])}</td><td class="hide-s">${esc(s["II. Сюжет"])}</td><td class="hide-s">${esc(s["III. Герои"])}</td><td class="hide-s">${esc(s["IV. Выбор"])}</td><td class="hide-s">${esc(s["V. Идея"])}</td><td>${new Date(r.created_at).toLocaleTimeString("ru", { hour: "2-digit", minute: "2-digit" })}</td></tr>`;
    const det = open.has(r.id) ? `<tr class="det"><td colspan="9"><b>Ошибки в тесте:</b> ${(r.details?.wrong || []).join(", ") || "нет"}<br><b>Ответ на вопрос урока:</b> ${esc(r.details?.own) || "<i>не написал</i>"}<br><span class="dup">История ${esc(s["I. История"])} · Сюжет ${esc(s["II. Сюжет"])} · Герои ${esc(s["III. Герои"])} · Выбор ${esc(s["IV. Выбор"])} · Идея ${esc(s["V. Идея"])}</span></td></tr>` : "";
    return main + det; }).join("");
  document.querySelectorAll("#tb tr[data-id]").forEach(tr => tr.onclick = () => { const id = tr.dataset.id; open.has(id) ? open.delete(id) : open.add(id); draw(); });
}
document.querySelectorAll("th[data-s]").forEach(th => th.onclick = () => { const k = th.dataset.s; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; draw(); });
$("#flt").oninput = draw; $("#last").onchange = draw;
$("#ref").onclick = () => load().then(draw).catch(e => alert(e.message));
$("#csv").onclick = () => {
  const head = ["Ученик", "Класс", "Тест", "Из", "История", "Сюжет", "Герои", "Выбор", "Идея", "Ошибки в тесте", "Ответ на вопрос урока", "Время"];
  const lines = view().map(r => { const s = r.details?.sections || {}; return [r.student, r.klass || "", r.score, r.total, s["I. История"], s["II. Сюжет"], s["III. Герои"], s["IV. Выбор"], s["V. Идея"], (r.details?.wrong || []).join(" "), r.details?.own || "", new Date(r.created_at).toLocaleString("ru")]; });
  const csv = "﻿" + [head, ...lines].map(l => l.map(x => `"${String(x ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "Тарас Бульба – результаты.csv"; a.click();
};
$("#go").onclick = enter; $("#eye").onclick = () => { const c = $("#code"); c.type = c.type === "password" ? "text" : "password"; }; $("#code").onkeydown = e => { if (e.key === "Enter") enter(); };
const saved = ls.get("tb2code"); if (saved) { $("#code").value = saved; enter(); }
</script>
</body>
</html>
