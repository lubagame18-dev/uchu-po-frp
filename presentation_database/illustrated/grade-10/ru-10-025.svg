<text x="120" y="116" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="bold" fill="#fffaf3">РУССКИЙ ЯЗЫК · 10 КЛАСС</text>
<text x="125" y="267" font-family="DejaVu Sans,Arial,sans-serif" font-size="52" font-weight="bold" fill="#762b35">Правописание н и нн в словах различных частей речи</text>
<path d="M125 357 H1790" stroke="#cfb6a9" stroke-width="3"/>
<text x="126" y="410" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="bold" fill="#496153">ОРФОГРАФИЯ</text>
<circle cx="1692" cy="122" r="42" fill="#f1e2d4"/>
<text x="1692" y="138" font-family="DejaVu Sans" font-size="38" fill="#762b35" text-anchor="middle">10</text>
<path d="M1550 900 C1620 810 1710 870 1790 760" fill="none" stroke="#b5bfa8" stroke-width="9" stroke-linecap="round"/>
<path d="M1550 900 C1570 825 1630 820 1645 855 C1600 865 1570 870 1550 900" fill="#b5bfa8"/>
<path d="M1700 827 C1700 760 1770 740 1790 760 C1750 795 1720 805 1700 827" fill="#b5bfa8"/>
<rect x="125" y="460" width="1665" height="108" rx="22" fill="#f3e8d7"/>
<circle cx="180" cy="514" r="26" fill="#762b35"/>
<text x="180" y="524" text-anchor="middle" font-family="DejaVu Sans" font-size="27" fill="white">1</text>
<text x="232" y="511" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="normal" fill="#332d2e">НН в полном причастии: есть приставка (кроме не-), зависимое слово, суффикс -ова-/-ева-,</text><text x="232" y="543" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="normal" fill="#332d2e">глагол сов. вида: выкрашенный</text>
<rect x="125" y="584" width="1665" height="108" rx="22" fill="#f7ede6"/>
<circle cx="180" cy="638" r="26" fill="#762b35"/>
<text x="180" y="648" text-anchor="middle" font-family="DejaVu Sans" font-size="27" fill="white">2</text>
<text x="232" y="635" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="normal" fill="#332d2e">Н в отглагольном прилагательном: нет ничего из этого: крашеный пол</text>
<rect x="125" y="708" width="1665" height="108" rx="22" fill="#f3e8d7"/>
<circle cx="180" cy="762" r="26" fill="#762b35"/>
<text x="180" y="772" text-anchor="middle" font-family="DejaVu Sans" font-size="27" fill="white">3</text>
<text x="232" y="759" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="normal" fill="#332d2e">краткое причастие → Н: книга прочитана; краткое прилагательное → как в полном: туман —</text><text x="232" y="791" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="normal" fill="#332d2e">туманна</text>
<rect x="125" y="832" width="1665" height="108" rx="22" fill="#f7ede6"/>
<circle cx="180" cy="886" r="26" fill="#762b35"/>
<text x="180" y="896" text-anchor="middle" font-family="DejaVu Sans" font-size="27" fill="white">4</text>
<text x="232" y="883" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="normal" fill="#332d2e">наречие на -о → как в слове, от которого образовано: взволнованно (взволнованный)</text>
<text x="125" y="990" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="normal" fill="#736962">Сведения перенесены из исходных материалов ·</text><text x="125" y="1022" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="normal" fill="#736962">требуют проверки</text>
<text x="1615" y="990" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#736962">ru-10-025</text>
