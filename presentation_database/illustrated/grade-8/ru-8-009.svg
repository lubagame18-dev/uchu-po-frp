<g font-family="Georgia,DejaVu Serif,serif"><text x="960" y="145" text-anchor="middle" font-size="65" fill="#fff7ec" font-weight="bold">Главные члены предложения</text><text x="960" y="237" text-anchor="middle" font-size="31" fill="#6b3740">РУССКИЙ ЯЗЫК · 8 КЛАСС · СХЕМА И АЛГОРИТМ</text></g>
<rect x="100" y="277" width="1720" height="115" rx="24" fill="#f2e4d9"/><text x="960" y="322" font-family="DejaVu Sans" font-size="32" text-anchor="middle" fill="#4b2e33">Грамматическая основа — подлежащее и сказуемое.</text><text x="960" y="365" font-family="DejaVu Sans" font-size="28" text-anchor="middle" fill="#4b2e33">Подлежащее подчёркиваем одной чертой, сказуемое — двумя.</text>
