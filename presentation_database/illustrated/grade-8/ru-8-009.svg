<text x="150" y="485" font-family="Georgia,DejaVu Serif" font-size="47" fill="#762b35" font-weight="bold">Подлежащее</text><text x="150" y="548" font-family="DejaVu Sans" font-size="33" fill="#252621">Кто? Что?</text><text x="150" y="601" font-family="DejaVu Sans" font-size="29" fill="#252621">О ком или о чём говорится?</text>
<text x="1070" y="485" font-family="Georgia,DejaVu Serif" font-size="47" fill="#762b35" font-weight="bold">Сказуемое</text><text x="1070" y="548" font-family="DejaVu Sans" font-size="33" fill="#252621">Что делает? Что сделал?</text><text x="1070" y="601" font-family="DejaVu Sans" font-size="29" fill="#252621">Что говорится о подлежащем?</text>
<text x="130" y="719" font-family="Georgia,DejaVu Serif" font-size="41" fill="#762b35" font-style="italic">Разберём предложение</text>
