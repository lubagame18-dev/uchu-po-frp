<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Подтверждение кабинета — Учу по ФРП</title>
<style>body{font:16px/1.6 system-ui,sans-serif;background:#f7f5ef;color:#243a32;margin:0}main{max-width:460px;margin:8vh auto;padding:24px}h1{font-size:27px}label{display:block;margin-top:16px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin:6px 0;border:1px solid #9fac9e;border-radius:8px}button{background:#225c50;color:white;cursor:pointer}button:disabled{opacity:.5}a{color:#225c50}#status{min-height:3em}</style>
<script src="js/accounts-config.js"></script><script src="js/accounts-backend.js"></script></head>
<body><main><h1 id="title">Подтверждение кабинета</h1><p id="status" role="status" aria-live="polite"></p><form id="form" hidden><div id="passwords" hidden><label for="password">Новый пароль (от 8 знаков)</label><input id="password" type="password" autocomplete="new-password" minlength="8"><label for="confirm">Повторите пароль</label><input id="confirm" type="password" autocomplete="new-password" minlength="8"></div><button id="submit">Подтвердить почту</button></form><p><a href="/">Вернуться на сайт и войти</a></p></main>
<script>
'use strict';
const params=new URLSearchParams(location.search),token=params.get('token'),type=params.get('type');
history.replaceState(null,'',location.pathname);
const status=document.getElementById('status'),form=document.getElementById('form'),submit=document.getElementById('submit');
const c=window.AccountsBackend?.config();
if(!token||!['verification','recovery'].includes(type)) status.textContent='Ссылка неполная. Запросите новое письмо в личном кабинете.';
else if(c?.provider!=='pocketbase'||!c.url) status.textContent='Новый сервер кабинета ещё не подключён. Свяжитесь с поддержкой сайта.';
else{
 form.hidden=false;status.textContent=type==='recovery'?'Задайте новый пароль. После сохранения войдите на сайте.':'Нажмите кнопку, чтобы подтвердить адрес почты.';
 if(type==='recovery'){document.getElementById('title').textContent='Новый пароль';document.getElementById('passwords').hidden=false;document.getElementById('password').required=true;document.getElementById('confirm').required=true;submit.textContent='Сохранить пароль';}
 form.addEventListener('submit',async e=>{
  e.preventDefault();const body={token};
  if(type==='recovery'){body.password=document.getElementById('password').value;body.passwordConfirm=document.getElementById('confirm').value;if(body.password!==body.passwordConfirm){status.textContent='Пароли не совпадают.';return;}}
  submit.disabled=true;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
  try{
   const origin=new URL(c.url).origin;
   const r=await fetch(origin+'/api/collections/uchu_users/'+(type==='recovery'?'confirm-password-reset':'confirm-verification'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal,referrerPolicy:'no-referrer'});
   if(!r.ok)throw Error('Ссылка недействительна или устарела. Запросите новое письмо.');
   form.hidden=true;status.textContent=type==='recovery'?'Пароль сохранён. Вернитесь на сайт и войдите с новым паролем.':'Почта подтверждена. Вернитесь на сайт и войдите.';
  }catch(err){status.textContent=err.name==='AbortError'?'Сервер не ответил. Попробуйте ещё раз.':err.message;submit.disabled=false;}finally{clearTimeout(timer);}
 });
}
</script></body></html>
